<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Gym &amp; Fitness Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<main>
<section class="login">
  <div class="box">
    <h1>Gym &amp; Fitness Management System</h1>
    <p class="mut">Sign in to manage members, trainers, plans, attendance and payments.</p>
    <div class="card">
      <div class="field"><label for="role">Sign in as</label>
        <select id="role"><option>Admin</option><option>Receptionist</option><option>Trainer</option><option>Member</option></select></div>
      <div class="field"><label for="user">Username</label><input id="user" type="text" autocomplete="username"></div>
      <div class="field"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password"></div>
      <a class="btn" href="dashboard.html">Log in</a>
      <p class="note"><a href="index.html">Forgot your password? Reset it</a></p>
    </div>
  </div>
</section>
</main>
</body>
</html>
